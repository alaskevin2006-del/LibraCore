# LibraCore API OpenAPI 3.0.3（独立编写，接口草案；未经联调）
# 2026-10-30 修订：仅做语义完善（可空字段、错误明细、说明与示例），未改动路径、operationId、字段名与既有约定。
openapi: 3.0.3
info:
  title: LibraCore Library Management API
  version: 0.2.0-draft
  description: |-
    LibraCore 四人项目的 API-first 契约草案（未实现、未合并、未冻结）。以具体馆藏副本为借还对象。由 Koha 的领域建模启发，但不是 Koha API 文件副本。
    字段为 snake_case；ID 为十进制字符串（可映射到 MySQL BIGINT，兼容 QML/JS 整数精度）；日期时间为 RFC3339 UTC。

    角色包括 reader/admin。授权模型分两层：`security` 表示"该接口是否需要认证"，角色限制由扩展字段 `x-required-roles` 表达（OpenAPI 3.0.3 无法原生表达角色）。`x-ownership-rule` 表示记录级归属规则，后端必须强制校验。`x-libracore-stage` 只是团队排期标记（M1/M2/M3 对应分阶段交付顺序），不代表当前已实现任何接口。

    统一响应约定：成功响应为 `data` 包装，列表为 `data` + `meta` 分页；错误响应一律 `application/problem+json`（RFC 9457 风格）。客户端必须以 `code` 字段分支，不得解析 `detail` 文案；字段级校验错误见 `errors` 数组。

    本文件是待团队评审的接口草案，确认后再按契约开发。尚未确定的业务规则集中列在根级 x-pending-decisions，仅作评审清单，不作为实现依据。
servers:
- url: http://localhost:8080
  description: 本地开发服务；部署时配置实际 HTTPS 地址
tags:
- name: health
  description: 健康检查
- name: auth
  description: 认证
- name: books
  description: 书目
- name: copies
  description: 具体馆藏副本
- name: readers
  description: 读者管理
- name: loans
  description: 借阅与归还
security:
- BearerAuth: []
# 尚未确定的业务规则：仅作团队评审清单，不作为实现依据，也不改变现有约定。
x-pending-decisions:
- key: loan-policy
  question: 借期长度、是否允许续借、单读者借阅上限、逾期罚则均未定义
  impact: 影响 due_at 计算、409 判定与 Qt 端"逾期"展示
- key: duplicate-loan-code
  question: 同一读者对同一 copy_id 重复提交，是否保留 COPY_UNAVAILABLE 还是新增 DUPLICATE_LOAN
  impact: 当前按 COPY_UNAVAILABLE 约定，新增错误码会导致前端分支变更
- key: health-scope
  question: /health 是否统一到 /api/v1 前缀；是否需要独立的 readiness（探测数据库）
  impact: 影响网关探针配置；当前 /health 只反映进程存活
- key: books-archived-visibility
  question: 管理员是否需要通过查询参数查看 status=archived 的书目；归档书目是否仍可按 ID 查询
  impact: 当前 GET /books 默认只返回 active
- key: copies-visibility
  question: GET /books/{book_id}/copies 是否包含 retired 副本、是否支持按 status 过滤
  impact: 读者端"可借副本"数量展示方式
- key: soft-delete-semantics
  question: 书目归档与读者注销在数据库层用 status 字段还是 deleted_at 时间戳
  impact: 影响 schema.sql 字段与查询条件
- key: reader-account-model
  question: reader 与登录账号是同一张表，还是 reader 引用独立的 user 表；admin 是否也有 reader 记录
  impact: 影响读者管理与认证的数据模型
- key: loan-denormalization
  question: Loan 是否冗余 book_id / book_title，或提供 expand 参数
  impact: 不冗余时 Qt 借阅列表需按 copy_id 逐个补查书目，产生 N+1 请求
- key: uniqueness-rules
  question: ISBN 是否要求唯一、barcode 唯一范围是全局还是按馆；ISBN 格式校验规则
  impact: 影响 409 DUPLICATE_RESOURCE 的判定条件
- key: out-of-scope-endpoints
  question: 是否补 GET /copies（全馆副本列表）、读者自助改密码、POST /auth/logout、429 限流
  impact: 当前 23 个操作未覆盖这些场景
paths:
  /health:
    get:
      tags:
      - health
      summary: 服务存活检查（不代表数据库一定可用）
      description: '刻意不带 /api/v1 前缀，用于容器探针与网关健康检查；只反映进程存活，不探测数据库。若需区分存活/就绪，另加独立接口（见待确认事项）。'
      operationId: getHealth
      security: []
      x-libracore-stage: M1
      responses:
        '200':
          description: 后端进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
              example:
                status: ok
      x-required-roles: []
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 用户登录
      operationId: login
      x-libracore-stage: M2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                data:
                  access_token: DEMO_TOKEN
                  token_type: Bearer
                  expires_in: 3600
                  user:
                    id: '42'
                    username: reader001
                    role: reader
                    display_name: 演示读者
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles: []
  /api/v1/me:
    get:
      tags:
      - auth
      summary: 获取当前登录用户
      operationId: getCurrentUser
      x-libracore-stage: M2
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles:
      - reader
      - admin
  /api/v1/books:
    get:
      tags:
      - books
      summary: 搜索和分页查询书目
      description: |-
        公开接口（无需认证）。默认只返回 `status=active` 的书目，已归档书目不出现在普通查询结果中。
        返回值直接支撑 Qt 读者端图书列表：`data[]` 的 `title`/`author` 用于主信息，`available_copies` 用于判断"可借"，`status` 用于异常态展示。
        `q` 对书名、作者、ISBN 做模糊匹配，空白字符串按未传处理。
      operationId: listBooks
      x-libracore-stage: M1
      security: []
      parameters:
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Category'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
              example:
                data:
                - id: '1001'
                  isbn: '9787302000000'
                  title: 软件工程导论
                  author: 示例作者
                  publisher: 示例出版社
                  category: 计算机
                  published_on: '2022-05-01'
                  description: 示例图书简介
                  status: active
                  total_copies: 3
                  available_copies: 2
                  created_at: '2026-10-27T06:00:00Z'
                - id: '1002'
                  isbn: null
                  title: 馆藏无 ISBN 的旧书
                  author: 佚名
                  publisher: null
                  category: null
                  published_on: null
                  description: null
                  status: active
                  total_copies: 1
                  available_copies: 0
                  created_at: '2026-10-20T02:30:00Z'
                meta:
                  page: 1
                  page_size: 20
                  total: 2
                  total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles: []
    post:
      tags:
      - books
      summary: 新增书目（管理员）
      operationId: createBook
      x-libracore-stage: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
          headers:
            Location:
              description: 新建资源的路径
              schema:
                type: string
              example: /api/v1/books/1001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles:
      - admin
  /api/v1/books/{book_id}:
    get:
      tags:
      - books
      summary: 书目详情
      description: 公开接口。返回书目字段与副本汇总（total_copies/available_copies）。已归档书目是否仍可按 ID 访问，见待确认事项。
      operationId: getBook
      x-libracore-stage: M2
      security: []
      parameters:
      - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles: []
    patch:
      tags:
      - books
      summary: 修改书目（管理员）
      operationId: updateBook
      x-libracore-stage: M2
      parameters:
      - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatch'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles:
      - admin
    delete:
      tags:
      - books
      summary: 归档书目（管理员；存在借出副本时拒绝）
      operationId: deleteBook
      x-libracore-stage: M2
      description: 软归档书目、将所有 available 副本统一退藏；若该书仍有 borrowed 副本则 409。保留书目和副本历史关联，归档后不再向普通书目查询返回该项。
      parameters:
      - $ref: '#/components/parameters/BookId'
      responses:
        '204':
          description: 成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles:
      - admin
  /api/v1/books/{book_id}/copies:
    get:
      tags:
      - copies
      summary: 查看某书目的馆藏副本列表
      description: '公开接口，供读者端判断某本书是否有可借副本。是否包含 retired 副本、是否支持按 status 过滤，见待确认事项；实现前先按当前分页约定返回。'
      operationId: listBookCopies
      x-libracore-stage: M2
      security: []
      parameters:
      - $ref: '#/components/parameters/BookId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles: []
    post:
      tags:
      - copies
      summary: 新增具体馆藏副本（管理员）
      operationId: createBookCopy
      x-libracore-stage: M2
      parameters:
      - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyCreate'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyResponse'
          headers:
            Location:
              description: 新建资源的路径
              schema:
                type: string
              example: /api/v1/copies/2001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles:
      - admin
  /api/v1/copies/{copy_id}:
    get:
      tags:
      - copies
      summary: 获取具体馆藏副本
      operationId: getCopy
      x-libracore-stage: M2
      security: []
      parameters:
      - $ref: '#/components/parameters/CopyId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles: []
    patch:
      tags:
      - copies
      summary: 修改副本条码（管理员；不得修改借阅状态）
      operationId: updateCopy
      x-libracore-stage: M2
      parameters:
      - $ref: '#/components/parameters/CopyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyPatch'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles:
      - admin
    delete:
      tags:
      - copies
      summary: 退藏具体副本（管理员；软退藏，已借出时拒绝）
      operationId: retireCopy
      x-libracore-stage: M2
      description: 不物理删除历史记录；状态从 available 变更为 retired。借阅中的副本拒绝操作。
      parameters:
      - $ref: '#/components/parameters/CopyId'
      responses:
        '204':
          description: 成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles:
      - admin
  /api/v1/readers:
    get:
      tags:
      - readers
      summary: 分页查询读者（管理员）
      operationId: listReaders
      x-libracore-stage: M2
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles:
